# Bond Centre चे JS/CSS बदलले की jsDelivr (CDN) ला लगेच नवीन file घ्यायला सांगतो,
# म्हणजे साईटवर बदल काही मिनिटांत दिसतो (नाहीतर 12 तासांपर्यंत जुनी file दिसू शकते).
name: Purge jsDelivr cache

on:
  push:
    branches: [main]
    paths: ["assets/bond-centre/**"]
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Purge (twice — jsDelivr ला "main" चा नवीन commit दिसायला 1-2 मिनिटं लागतात)
        run: |
          purge() { for f in bond-centre.js bond-centre.css logo.png; do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/assets/bond-centre/$f" | head -c 200; echo
          done; }
          sleep 60; purge
          sleep 120; purge
          # खात्री: CDN वरची file आता या commit शी जुळते का
          want=$(sha1sum assets/bond-centre/bond-centre.js 2>/dev/null | cut -c1-40 || true)
          echo "commit file sha1: ${want:-n/a}"
