# LIC plans data — दर सोमवारी सकाळी 9:43 IST ला LIC च्या साईटवरून brochures तपासतो
#   scripts/fetch_lic_plans.py → data/lic/lic-plans.json (A4U LIC Calculator plugin हाच वाचतो)
#                              → data/lic/status.json (प्रत्येक URL चा निकाल)
#                              → data/lic/brochures/<plan>/<sha>.pdf (brochure ची जपलेली copy)
# हाताने चालवायचं असेल: Actions टॅब → "Update LIC plans data" → "Run workflow"
name: Update LIC plans data

on:
  schedule:
    - cron: "13 4 * * 1"   # 04:13 UTC सोमवार = 9:43 AM IST
  workflow_dispatch:
    inputs:
      force:
        description: "1 = brochure बदललं नसलं तरी Gemini ने पुन्हा वाचा"
        required: false
        default: "0"
  push:
    branches: [main]
    paths:
      - scripts/fetch_lic_plans.py
      - data/lic/plans_watch.json
      - .github/workflows/lic_plans.yml

permissions:
  contents: write

concurrency:
  group: lic-plans-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIC_FORCE: ${{ github.event.inputs.force || '0' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check LIC brochures
        run: python scripts/fetch_lic_plans.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/lic 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update LIC plans data"
            git pull --rebase
            git push
          fi
