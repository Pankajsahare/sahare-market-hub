# LIC plans data — आठवड्यातून दोनदा (सोम, गुरु) सकाळी 9:43 IST ला LIC च्या साईटवरून brochures तपासतो
#   (काही बदललं नसेल तर Gemini वापरला जात नाही आणि run 1 मिनिटात संपतो)
#   scripts/fetch_lic_plans.py → data/lic/lic-plans.json (A4U LIC Calculator plugin हाच वाचतो)
#                              → data/lic/status.json (प्रत्येक URL चा निकाल)
#                              → data/lic/brochures/<plan>/<sha>.pdf (brochure ची जपलेली copy)
# हाताने चालवायचं असेल: Actions टॅब → "Update LIC plans data" → "Run workflow"
name: Update LIC plans data

on:
  schedule:
    - cron: "13 4 * * 1,4"   # 04:13 UTC = 9:43 AM IST, सोम + गुरु (brochures क्वचितच बदलतात; Actions मिनिटं वाचतात)
  workflow_dispatch:
    inputs:
      force:
        description: "1 = brochure बदललं नसलं तरी Gemini ने पुन्हा वाचा"
        required: false
        default: "0"
  push:
    branches: [main]
    paths:
      - scripts/fetch_lic_plans.py
      - data/lic/plans_watch.json
      - .github/workflows/lic_plans.yml
      - wp/a4u-lic-calculator/tests/golden.js

permissions:
  contents: write

concurrency:
  group: lic-plans-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIC_FORCE: ${{ github.event.inputs.force || '0' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main  # रांगेत थांबलेला run सुद्धा सगळ्यात नवीन data पासून सुरू व्हावा

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test tool
        run: npm install --no-save --no-audit --no-fund jsdom@24 >/dev/null

      - name: Check LIC brochures
        run: python scripts/fetch_lic_plans.py

      # S2: golden tests — नवीन data ने calculator बिघडत असेल तर तो data commit होत नाही
      - name: Golden tests
        run: |
          if ! node wp/a4u-lic-calculator/tests/golden.js data/lic/lic-plans.json > /tmp/golden.txt 2>&1; then
            cat /tmp/golden.txt
            git checkout -- data/lic/lic-plans.json
            python -c "import sys; sys.path.insert(0,'scripts'); from common import notify; notify('❌ A4U LIC: नवीन LIC data golden tests मध्ये अडकला — live calculator बदललेला नाही.\n\n' + open('/tmp/golden.txt').read()[-1500:])"
          else
            cat /tmp/golden.txt
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/lic 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update LIC plans data"
            # दुसरा run/bot मधेच commit करून गेला तरी आपला नवा data जिंकू दे, 3 वेळा प्रयत्न
            for i in 1 2 3; do
              git pull --rebase -X theirs && git push && exit 0
              git rebase --abort 2>/dev/null || true
              sleep $((i * 10))
            done
            exit 1
          fi
