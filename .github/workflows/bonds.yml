# A4U Bond Centre data — सोम ते शुक्र, संध्याकाळी 7:23 IST ला आपोआप चालतो
#   (तासाच्या ठोक्यावर GitHub वर गर्दी असते, म्हणून मुद्दाम :53 मिनिट निवडलं)
#   1) fetch_market.py     → data/bond_market.json  (G-Sec curve, बाजार आकडे, RBI rates)
#   2) fetch_bonds.py      → data/bonds.json        (SGB + G-Sec)
#   3) fetch_corp_bonds.py → data/corp_list.json + corp_details.json + corp_bonds.json (corporate bonds + issue details)
# Details cache आणि रोजचा व्यवहार-इतिहास "data-cache" branch मध्ये राहतो (main हलकी राहते).
# हाताने चालवायचं असेल: Actions टॅब → "Update bond prices" → "Run workflow"
name: Update bond prices

on:
  schedule:
    - cron: "53 13 * * 1-5"   # 13:53 UTC = 7:23 PM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bonds-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore pipeline cache (data-cache branch)
        run: |
          git fetch --depth=1 origin data-cache
          git show FETCH_HEAD:cache.json > data/cache.json 2>/dev/null || git show FETCH_HEAD:nsdl_cache.json > data/cache.json   # जुनं नाव → नवं नाव (एकदाच)
          git show FETCH_HEAD:corp_history.json > data/corp_history.json
          echo "OLD_CACHE_BYTES=$(stat -c%s data/cache.json)" >> "$GITHUB_ENV"

      - name: Market snapshot (curve, market stats)
        run: python scripts/fetch_market.py

      - name: SGB + G-Sec prices
        run: python scripts/fetch_bonds.py

      - name: Corporate bonds + issue details
        run: python scripts/fetch_corp_bonds.py

      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update bond data"
            git pull --rebase
            git push
          fi

      - name: Save pipeline cache (data-cache branch, single commit)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$OLD_CACHE_BYTES" ] || { echo "Cache was not restored; not saving"; exit 0; }
          new=$(stat -c%s data/cache.json 2>/dev/null || echo 0)
          if [ "$new" -lt $((OLD_CACHE_BYTES / 2)) ]; then echo "New cache looks too small ($new bytes); keeping old"; exit 0; fi
          rm -rf /tmp/dc && mkdir /tmp/dc && cp data/cache.json data/corp_history.json /tmp/dc/
          cd /tmp/dc
          git init -q -b data-cache
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Bond pipeline cache (auto, single commit)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-cache
