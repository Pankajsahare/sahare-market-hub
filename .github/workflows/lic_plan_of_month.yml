# S4: दर महिन्याच्या 1 तारखेला (सकाळी 10:17 IST) "LIC Plan of the Month" Telegram channel वर
#   हाताने चालवायचं: Actions → "LIC plan of the month" → Run workflow (हवा तर plan नंबर द्या)
name: LIC plan of the month

on:
  schedule:
    - cron: "47 4 1 * *"
  workflow_dispatch:
    inputs:
      plan_id:
        description: "Plan number (blank = automatic rotation)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/lic_plan_of_month.py
            wp/a4u-lic-calculator/plugin/a4u-lic-calculator/assets/data/lic-plan-notes.json
      - name: Post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PLAN_ID: ${{ github.event.inputs.plan_id }}
        run: python3 -I scripts/lic_plan_of_month.py
